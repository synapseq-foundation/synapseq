name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    container:
      image: golang:1.26-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "package_version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

      - name: Install dependencies
        run: |
          apk add --no-cache make zip tar bash gzip dpkg rpm

      - name: Install nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Test build
        run: |
          make test

      - name: Build binaries
        run: |
          make build-windows-amd64
          make build-windows-arm64
          make build-linux-amd64
          make build-linux-arm64
          make build-macos

      # WASM release artifacts are deprecated. The browser runtime is kept only
      # for historical reference and is no longer built or published in releases.
      #
      # - name: Build WASM
      #   run: |
      #     make build-wasm

      - name: Prepare packaging directory
        run: |
          mkdir -p packages

      - name: Package all binaries
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          # Function to package binaries
          package_binary() {
            local platform=$1
            local arch=$2
            local ext=$3
            local compress=$4
            
            local pkg_name="synapseq-${VERSION}-${platform}-${arch}"
            local bin_src="bin/synapseq-${platform}-${arch}${ext}"
            local bin_name="synapseq-${VERSION}-${platform}-${arch}${ext}"
            local sha_name="${bin_name}.sha256"
            
            echo "Packaging ${pkg_name}..."
            
            # Create temporary directory for packaging
            mkdir -p "temp-${pkg_name}"
            
            # Copy binary with versioned name
            cp "${bin_src}" "temp-${pkg_name}/${bin_name}"
            
            # Set executable permission for Unix systems
            if [ -z "$ext" ]; then
              chmod +x "temp-${pkg_name}/${bin_name}"
            fi
            
            # Generate SHA256 for the binary
            cd "temp-${pkg_name}"
            sha256sum "${bin_name}" > "${sha_name}"
            cd ..
            echo "✓ SHA256 generated: ${sha_name}"
            
            # Create compressed package
            if [ "$compress" = "zip" ]; then
              cd "temp-${pkg_name}"
              zip "../packages/${pkg_name}.zip" "${bin_name}" "${sha_name}"
              cd ..
            else
              tar -czf "packages/${pkg_name}.tar.gz" -C "temp-${pkg_name}" "${bin_name}" "${sha_name}"
            fi
            
            # Clean up temporary directory
            rm -rf "temp-${pkg_name}"
            echo "✓ ${pkg_name} packaged successfully"
          }

          # Package Windows binaries (ZIP format)
          package_binary "windows" "amd64" ".exe" "zip"
          package_binary "windows" "arm64" ".exe" "zip"

          # Package Linux binaries (TAR.GZ format)
          package_binary "linux" "amd64" "" "tar.gz"
          package_binary "linux" "arm64" "" "tar.gz"

          # Package macOS binaries (TAR.GZ format)
          package_binary "macos" "arm64" "" "tar.gz"

      - name: Package Linux distributions
        env:
          PACKAGE_VERSION: ${{ steps.get_version.outputs.package_version }}
        run: |
          export PATH="/go/bin:${PATH}"

          package_linux() {
            local arch=$1
            local rpm_arch=$2

            PACKAGE_ARCH="${arch}" PACKAGE_BINARY="bin/synapseq-linux-${arch}" nfpm package \
              --config packaging/nfpm.yaml \
              --packager deb \
              --target "packages/synapseq_${PACKAGE_VERSION}_${arch}.deb"

            PACKAGE_ARCH="${arch}" PACKAGE_BINARY="bin/synapseq-linux-${arch}" nfpm package \
              --config packaging/nfpm.yaml \
              --packager rpm \
              --target "packages/synapseq-${PACKAGE_VERSION}-1.${rpm_arch}.rpm"
          }

          package_linux amd64 x86_64
          package_linux arm64 aarch64

      - name: Verify Linux packages
        env:
          PACKAGE_VERSION: ${{ steps.get_version.outputs.package_version }}
        run: |
          verify_deb() {
            local arch=$1
            local package="packages/synapseq_${PACKAGE_VERSION}_${arch}.deb"

            test "$(dpkg-deb --field "${package}" Package)" = "synapseq"
            test "$(dpkg-deb --field "${package}" Version)" = "${PACKAGE_VERSION}-1"
            test "$(dpkg-deb --field "${package}" Architecture)" = "${arch}"
            test "$(dpkg-deb --field "${package}" Depends)" = "ffmpeg"
            dpkg-deb --contents "${package}" | grep -q ' ./usr/bin/synapseq$'
          }

          verify_rpm() {
            local arch=$1
            local package="packages/synapseq-${PACKAGE_VERSION}-1.${arch}.rpm"

            test "$(rpm -qp --qf '%{NAME}' "${package}")" = "synapseq"
            test "$(rpm -qp --qf '%{VERSION}' "${package}")" = "${PACKAGE_VERSION}"
            test "$(rpm -qp --qf '%{ARCH}' "${package}")" = "${arch}"
            rpm -qp --requires "${package}" | grep -qx 'ffmpeg'
            rpm -qpl "${package}" | grep -qx '/usr/bin/synapseq'
          }

          verify_deb amd64
          verify_deb arm64
          verify_rpm x86_64
          verify_rpm aarch64

      # WASM release artifacts are deprecated. The browser runtime is kept only
      # for historical reference and is no longer built or published in releases.
      #
      # - name: Package WASM
      #   run: |
      #     VERSION="${{ steps.get_version.outputs.version }}"
      #     pkg_name="synapseq-${VERSION}-wasm"
      #
      #     echo "Packaging WASM version..."
      #
      #     # Create temporary directory for packaging
      #     mkdir -p "temp-${pkg_name}"
      #
      #     # Copy WASM files
      #     cp wasm/synapseq.wasm "temp-${pkg_name}/"
      #     cp wasm/synapseq.js "temp-${pkg_name}/"
      #     cp wasm/wasm_exec.js "temp-${pkg_name}/"
      #     cp wasm/example.html "temp-${pkg_name}/"
      #
      #     # Generate SHA256 checksums for WASM files
      #     cd "temp-${pkg_name}"
      #     sha256sum synapseq.wasm synapseq.js wasm_exec.js example.html > checksums.txt
      #     cd ..
      #     echo "✓ SHA256 checksums generated for WASM files"
      #
      #     # Create ZIP package
      #     cd "temp-${pkg_name}"
      #     zip "../packages/${pkg_name}.zip" synapseq.wasm synapseq.js wasm_exec.js example.html checksums.txt
      #     cd ..
      #
      #     # Clean up temporary directory
      #     rm -rf "temp-${pkg_name}"
      #     echo "✓ ${pkg_name} packaged successfully"

      - name: Generate checksums
        run: |
          cd packages
          sha256sum *.zip *.tar.gz *.deb *.rpm > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: SynapSeq ${{ steps.get_version.outputs.version }}
          files: |
            packages/*.zip
            packages/*.tar.gz
            packages/*.deb
            packages/*.rpm
            packages/checksums.txt
          draft: true
          prerelease: false
          generate_release_notes: no
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
